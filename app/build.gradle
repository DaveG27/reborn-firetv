plugins {
    id 'com.android.application'
}

android {
    namespace 'app.reborn.iptv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.reborn.iptv'
        minSdk 22          // Fire OS 5+ (all Fire TV sticks still in use)
        targetSdk 34
        versionCode 7
        versionName '1.6'

        // Change this if the web app ever moves.
        buildConfigField 'String', 'START_URL', '"https://reborn-iptv.vercel.app/"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away via Downloader.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native video player (same engine family TiviMate and most Android TV players use)
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
}
