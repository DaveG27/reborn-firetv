plugins {
    id 'com.android.application'
}

android {
    namespace 'app.reborn.iptv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.reborn.iptv'
        minSdk 22          // Fire OS 5+ (all Fire TV sticks still in use)
        targetSdk 34
        versionCode 2
        versionName '1.1'

        // Change this if the web app ever moves.
        buildConfigField 'String', 'START_URL', '"https://reborn-iptv.vercel.app/"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away via Downloader.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
